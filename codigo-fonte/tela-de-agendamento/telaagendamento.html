<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="telaagendamento.css">
    <title>Tela de Agendamento</title> <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poetsen+One">
</head>

<body>
    <div class="fundo"></div>

    <div class="consu">
        <h2>Agendar Consulta</h2>
        
        <form>
            <div class="form-content">
                <div class="linha">
                    <label for="paciente">Paciente:</label>
                    <input type="text" id="paciente" placeholder="Nome do paciente">
                </div>
                
                <div class="linha">
                    <label for="profissional">Profissional:</label>
                    <input type="text" id="profissional" placeholder="Nome do profissional">
                </div>
                
                <div class="linha">
                    <label for="especialidade">Especialidade:</label>
                    <input type="text" id="especialidade" placeholder="Ex: Cardiologia">
                </div>

                <div class="linha">
                    <label for="data">Data da consulta:</label>
                    <input type="date" id="data">
                </div>
                
                <div class="linha">
                    <label for="horario">Horário da consulta:</label>
                    <input type="time" id="horario">
                </div>
                
                <div class="linha">
                     <label for="observacoes">Observações:</label>
                    <input type="text" id="observacoes" placeholder="Digite aqui">
                </div>
            </div>

            <div class="botoes">
                <button type="submit" class="btn-azul">Confirmar agendamento</button>
                
                <button type="button" class="btn-cinza">Cancelar</button>
                
                <a href="../Tela do menu principal/Menu.html" class="btn-verde">Retornar ao Menu Principal</a>
            </div>
        </form>
