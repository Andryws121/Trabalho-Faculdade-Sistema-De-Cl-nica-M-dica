<!DOCTYPE html>
<html lang="pt-br">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="styles.css">
    <title>tela de agendamento</title> <!-- tela onde o paciente vai realizar o agendamento das consultas-->
    <link rel="stylesheet" href="https://fonts.googleapis,com/css?family=poetsen+one">
    
</head>
<body>
  <div class="fundo"></div>
  <div class="consu">
  <h2>Agendar consulta </h2>
    
   <form> 
    
    <div class="form-content">
    
    <div class="linha">
     <label for="=paciente">Paciente:</label>
    <input type="text" id="paciente" placeholder="nome do paciente">
   </div>
    
   <div class="linha">
    <label for="=profissional">Profissional:</label>
    <input type="text" id="Profissional" placeholder=" Nome do profissional">
  
  </div>    
    
    <div class="linha">
      <label for="=especialista">Especialidade:</label>
    <input type="text" id="Especialidade" placeholder="Ex: Cardiologia">
   
  </div>

    <div class="linha">
    <label for="data">Data da consulta:</label>
     <input type="date" id="data">
    
    </div>
    
     <div class="linha">
     <label for="hora">Horário da consulta:</label>
     <input type="time" id="Horario da consulta">
    
    </div>
    
     <div class="linha">
    <label for="=observação">Observações:</label>
    <input type="text" id="Observações" placeholder="Digite aqui">
      
      </div>
  
  <div class="botoes">
    <button type="submit"class="btn-azul">Confimar agendamento</button>
     <button type="reset" class="btn-cinza"> cancelar</button>
    </div>
  </div>
</form>
</div>
</body> 

</html>
