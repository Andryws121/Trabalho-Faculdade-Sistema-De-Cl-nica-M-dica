<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Profissional - Medzo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poetsen+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastro_medico.css">
</head>

<body>
    <div class="container">
        <div class="info-panel">
            <div class="logo">
                <img src="logo_sem_nome.png" alt="Logo da Medzo" width="60">
                <span>Medzo</span>
            </div>
            <h1>Cadastro Profissional</h1>
            <p>Preencha o formulário ao lado para criar seu acesso e ter acesso a todos os nossos recursos exclusivos.
            </p>
        </div>
        <div class="form-panel">
            <form action="#" method="post">
                <p class="required-notice">* Campo obrigatório</p>
                <div class="form-grid">
                    <div class="form-group span-2">
                        <label for="conselho">Conselho profissional de classe*</label>
                        <input type="text" id="conselho" name="conselho" placeholder="Digite seu CRM, CMF, COREN..."
                            required>
                    </div>
                    <div class="form-group">
                        <label for="uf">UF*</label>
                        <select id="uf" name="uf" required>
                            <option value="" disabled selected>Selecionar</option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP">SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                    <div class="form-group span-3">
                        <label for="nome-medico">Nome do médico*</label>
                        <input type="text" id="nome-medico" name="nome-medico" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group span-2">
                        <label for="cpf">CPF*</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group phone-group">
                        <label for="ddd">Telefone*</label>
                        <div class="phone-inputs">
                            <input type="text" id="ddd" name="ddd" placeholder="DDD" maxlength="2" required>
                            <input type="text" id="telefone" name="telefone" placeholder="90000-0000" required>
                        </div>
                    </div>
                    <div class="form-group span-3">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000">
                    </div>
                    <div class="form-group span-2">
                        <label for="logradouro">Logradouro</label>
                        <input type="text" id="logradouro" name="logradouro" placeholder="Rua, Avenida..." readonly>
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" readonly>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" readonly>
                    </div>
                    <div class="form-group">
                        <label for="complemento">Número / Comp.</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Nº e Apto.">
                    </div>
                    <div class="form-group span-3">
                        <label for="senha">Senha*</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                    </div>
                </div>
                <div class="form-actions">
                    <a href="/codigo-fonte/tela-de-cadastro-ozias/tela_de_cadastro.html" class="btn btn-secondary"
                        style="text-decoration: none;">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Continuar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
