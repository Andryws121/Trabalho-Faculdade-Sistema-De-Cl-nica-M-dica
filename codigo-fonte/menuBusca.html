<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Busca</title>
    <link rel="stylesheet" href="css/MenuBusca.css">
</head>
<body>

    <main class="search-container">
        <h1>Menu de Busca</h1>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nome do profissional...">
        <button id="searchButton" class="searchButton">BUSCAR</button>
        <button id="backButton" class="btn-voltar">VOLTAR</button>
    </div>

        <section class="filters-section">
            <h2>Filtros Detalhados</h2>
            <div class="filters-grid">
                 <div class="filter-box">
                     <label>Especialidade</label>
                     <button id="btnEspecialidade" class="dropdown-btn">Selecionar</button>
                     <ul id="listaEspecialidades" class="dropdown-list hidden"></ul>
                </div>

                <div class="filter-box">
                    <label>Data da Consulta</label>
                    <div class="date-filter-value">
                        <span>Cancelada</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </div>
                </div>
                <div class="filter-box">
                    <label>Status</label>
                    <a href="#">Cancelada</a>
                </div>
            </div>
        </section>

        <section class="results-section">
            <h2>Resultados de Busca (<span id="resultsCount">0</span>)</h2>
            <ul id="resultsList" class="results-list">
                </ul>
        </section>

    </main>

    <script src="js/MenuBusca.js"></script>
</body>
</html>
