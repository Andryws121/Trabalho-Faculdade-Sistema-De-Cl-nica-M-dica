<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/TelaAgendamento.css">
    <title>Tela de Agendamento</title> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poetsen+One&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
    
</head>

<body>
    <div class="fundo"></div>

    <div class="consu">
        <h2>Agendar Consulta</h2>
        
        <form>
            <div class="form-content">
                <div class="linha">
                    <label for="paciente">Paciente:</label>
                    <input type="text" id="paciente" placeholder="Nome do paciente">
                </div>
                
                <div class="linha">
                    <label for="profissional">Profissional:</label>
                    <input list="lista-profissionais" id="profissional" placeholder="Escolha o profissional">
                    <datalist id="lista-profissionais"></datalist>
                </div>
                
                <div class="linha">
                    <label for="especialidade">Especialidade:</label>
                    <input id="especialidade" placeholder="Especialidade" readonly>
                </div>

                <div class="linha">
                    <label for="data">Data da consulta:</label>
                    <input type="date" id="data">
                </div>
                
                <div class="linha">
                    <label for="horario">Horário da consulta:</label>
                    <select id="horario"></select>
                </div>
                
                <div class="linha">
                     <label for="observacoes">Observações:</label>
                    <input type="text" id="observacoes" placeholder="Digite aqui">
                </div>
            </div>

            <div class="botoes">
                <button type="submit" class="btn-azul" onclick="history.back()">Confirmar agendamento</button>
                
                <button type="button" class="btn-cinza" onclick="history.back()">Cancelar</button>


                 <!-- precisamos fazer um sistema para se o usuarioé médico ao clicar pra voltar, ele volta pro menu médico e se ele é paciente volta pro menu paciente -->
<a href="MenuPaciente.html" class="btn-verde">Retornar ao Menu Principal</a>            </div>
        </form>
    <script src="js/TelaAgendamento.js"></script>
</body>
</html>
