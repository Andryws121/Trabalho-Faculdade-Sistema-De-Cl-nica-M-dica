<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Agenda</title>
    <link rel="stylesheet" href="configuração_de_agenda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="config-container">
        <h1>Configuração de agenda</h1>
        
        <form id="config-form">
            
           <div class="main-layout">
                <section class="profile-section">
                    <div class="profile-header">
                        <img src="/codigo-fonte/configuração-de-agenda-ozias/Maria_oliveira.png.png" alt="Foto da Dra. Maria Oliveira" class="profile-pic">
                        <div class="profile-title">
                            <h2>Dra. Maria Oliveira</h2>
                            <span class="specialty">Dermatologista</span>
                        </div>
                    </div>
                    
                    <button type="button" class="btn btn-secondary schedule-btn">Agendar Consulta</button>

                    <div class="profile-inputs">
                        <div class="input-group">
                            <label for="crm">CRM</label>
                            <input type="text" id="crm" name="crm">
                        </div>
                        <div class="input-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone">
                        </div>
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" value="dr.Mar@doc.br">
                        </div>
                    </div>

                    <div class="week-days">
                        <div class="day-check">
                            <label for="segunda">segunda feira</label>
                            <input type="checkbox" id="segunda" name="day" value="seg">
                        </div>
                        <div class="day-check">
                            <label for="terca">Terça - Feira</label>
                            <input type="checkbox" id="terca" name="day" value="ter">
                        </div>
                        <div class="day-check">
                            <label for="quarta">Quarta - Feira</label>
                            <input type="checkbox" id="quarta" name="day" value="qua">
                        </div>
                        <div class="day-check">
                            <label for="quinta">Quinta - Feira</label>
                            <input type="checkbox" id="quinta" name="day" value="qui">
                        </div>
                        <div class="day-check">
                            <label for="sexta">Sexta - Feira</label>
                            <input type="checkbox" id="sexta" name="day" value="sex">
                        </div>
                        <div class="day-check">
                            <label for="sabado">Sábado</label>
                            <input type="checkbox" id="sabado" name="day" value="sab">
                        </div>
                        <div class="day-check disabled">
                            <label for="domingo">Domingo</label>
                            <input type="checkbox" id="domingo" name="day" value="dom" disabled>
                        </div>
                    </div>
                </section>

                <section class="schedule-section">
                    <h3>
                        <i class="fa-regular fa-calendar-days"></i>
                        Disponibilidade de horários e de atendimento
                        <i class="fa-regular fa-clock"></i>
                    </h3>

                    <div class="availability-layout">
                        <div class="time-slots">
                            <div class="time-period">
                                <div class="input-group">
                                    <label for="start-time">Horário de Início</label>
                                    <input type="time" id="start-time" name="start_time" value="00:00">
                                </div>
                                <div class="input-group">
                                    <label for="end-time">Horário de Fim</label>
                                    <input type="time" id="end-time" name="end_time" value="00:00">
                                </div>
                            </div>
                            <button type="button" class="btn btn-add-period">+ Adicionar Período</button>
                        </div>
                    </div>

                    <h3>
                        Duração da Consulta Padrão
                        <i class="fa-regular fa-calendar-plus"></i>
                    </h3>
                    <div class="duration-section">
                        <ul class="duration-list">
                            <li><span>15 minutos</span> <button type="button" class="btn-icon">+</button></li>
                            <li><span>15 minutos</span> <button type="button" class="btn-icon">+</button></li>
                            <li class="default"><span>15 (Padrão)</span> <button type="button" class="btn-icon">+</button></li>
                        </ul>
                        <button type="button" class="btn btn-secondary block-dates-btn">Bloquear Datas Específicas</button>
                    </div>

                </section>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                <button type="button" class="btn btn-cancel">Cancelar</button>
            </div>

        </form>
    </div>

    <script src="configuração_de_agenda.js"></script>
</body>
</html>
