<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Paciente</title>
    <link rel="stylesheet" href="css/CadastroPaciente.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="form-image">
            <img src="img/medzo.svg" alt="Logo Medzo">
            <div class="welcome-text">
                <h2>Bem-vindo!</h2>
                <p>Crie sua conta para agendar consultas e cuidar da sua saúde.</p>
            </div>
        </div>

        <div class="form">
            <form action="#">
                <div class="form-header">
                    <h1>Criar Conta</h1>
                </div>

                <div class="input-group">
                    <div class="input-box">
                        <label for="firstname">Nome</label>
                        <input id="firstname" type="text" name="firstname" placeholder="Primeiro nome" required>
                    </div>

                    <div class="input-box">
                        <label for="lastname">Sobrenome</label>
                        <input id="lastname" type="text" name="lastname" placeholder="Sobrenome" required>
                    </div>

                    <div class="input-box">
                        <label for="email">E-mail</label>
                        <input id="email" type="email" name="email" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="input-box">
                        <label for="cpf">CPF</label>
                        <input id="cpf" type="text" name="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <div class="input-box">
                        <label for="number">Celular</label>
                        <input id="number" type="tel" name="number" placeholder="(xx) 9xxxx-xxxx" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <div class="input-box">
                        <label for="confirmpassword">Confirmar Senha</label>
                        <input id="confirmpassword" type="password" name="confirmpassword" placeholder="Repita a senha" required>
                    </div>
                </div>

                <div class="gender-inputs">
                    <div class="gender-title">
                        <h6>Gênero</h6>
                    </div>
                    <div class="gender-group">
                        <div class="gender-input">
                            <input type="radio" id="male" name="gender" value="Masculino">
                            <label for="male">Masculino</label>
                        </div>
                        <div class="gender-input">
                            <input type="radio" id="female" name="gender" value="Feminino">
                            <label for="female">Feminino</label>
                        </div>
                    </div>
                </div>

                <div class="continue-button">
                    <button type="submit">CADASTRAR</button>
                </div>
                
                <div style="text-align: center; margin-top: 15px;">
                    <a href="TelaLogin.html" style="color: #adb5bd; text-decoration: none; font-size: 0.9rem; font-family: 'Roboto', sans-serif;">Já tem conta? Faça Login</a>
                </div>

            </form>
        </div>
    </div>

    <script src="js/CadastroPaciente.js"></script>
</body>
</html>
